<!DOCTYPE html>
<html>
<head>
    <title>Login - Anantam ERP</title>
</head>
<body style="display:flex;justify-content:center;align-items:center;height:100vh;background:#f1f5f9;">

<form method="post" style="background:white;padding:30px;border-radius:10px;width:300px;">
    {% csrf_token %}

    <h2 style="text-align:center;">🔐 Login</h2>

    {% if error %}
        <p style="color:red;">{{ error }}</p>
    {% endif %}

    <input type="text" name="username" placeholder="Username" required style="width:100%;margin:10px 0;padding:8px;">
    <input type="password" name="password" placeholder="Password" required style="width:100%;margin:10px 0;padding:8px;">

    <button type="submit" style="width:100%;padding:10px;background:#2563eb;color:white;border:none;border-radius:5px;">
        Login
    </button>
</form>

</body>
</html>
