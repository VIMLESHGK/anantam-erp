<h2>{{ account.name }} Ledger</h2>

<table border="1" cellpadding="5">
    <tr>
        <th>Date</th>
        <th>Reference</th>
        <th>Debit</th>
        <th>Credit</th>
        <th>Balance</th>
    </tr>

    {% for row in ledger_data %}
    <tr>
        <td>{{ row.date }}</td>
        <td>{{ row.reference }}</td>
        <td>{{ row.debit }}</td>
        <td>{{ row.credit }}</td>
        <td>{{ row.balance }}</td>
    </tr>
    {% endfor %}
</table>

<h3>Final Balance: {{ balance }}</h3>
